name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # The Elixir port lives in elixir/ and builds alongside the Go tree, which
  # stays the shipped one. Toolchain versions come from elixir/.tool-versions.
  elixir:
    name: Elixir
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: elixir/.tool-versions
          version-type: strict

      # The store tests build and run the real Go binary against
      # Elixir-created databases -- both binaries have to open the same file
      # during the transition, and that is not a fact worth asserting by eye.
      # Without a toolchain here `Tend.Store.GoParityTest` skips itself, which
      # is honest but leaves three acceptance criteria unguarded on CI.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # deps/ and _build/ are cached together: the store's SQLite driver is a
      # NIF and would otherwise be compiled from C on every run. The key is
      # the lock file, so a dependency change starts from a clean slate.
      - uses: actions/cache@v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/.tool-versions', 'elixir/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      # The domain port reads stored UTC as local time the way Go's time.Local
      # does, and the runner is UTC, where that conversion is the identity and
      # the tests covering it would pass for the wrong reason. So the suite
      # runs again in a zone either side of UTC -- one whose local date is
      # behind UTC's, one ahead, both with DST.
      - name: Test
        run: mix test

      - name: Test (TZ=America/New_York)
        run: mix test
        env:
          TZ: America/New_York

      - name: Test (TZ=Pacific/Auckland)
        run: mix test
        env:
          TZ: Pacific/Auckland

      - name: Format
        run: mix format --check-formatted
